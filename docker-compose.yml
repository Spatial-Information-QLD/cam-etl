# GraphDB needs Docker Desktop to have at least 8GB to function at a reasonable performance.

services:
  postgres:
    build:
      dockerfile: ./Dockerfile
      context: .
    command: >-
      -c max_wal_size=4GB
    # shm_size required when running ETL on large tables
    shm_size: "2gb"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./QSC_Extracted_Data_20260409_085327345773-8968:/tmp/qrt
      # - ./postgres-backup:/tmp/postgres-backup
    ports:
      - 5432:5432
    networks:
      - postgres
    profiles:
      - postgres

  graphdb:
    image: ontotext/graphdb:10.8.5
    volumes:
      - graphdb-data:/opt/graphdb/home
    ports:
      - 7200:7200
    environment:
      GDB_JAVA_OPTS: >-
        -Xmx16g -Xms4g
        -Dgraphdb.home=/opt/graphdb/home
        -Dgraphdb.workbench.importDirectory=/opt/graphdb/home/graphdb-import
        -Dgraphdb.workbench.cors.enable=true
        -Denable-context-index=true
        -Dentity-pool-implementation=transactional
        -Dhealth.max.query.time.seconds=600
        -Dgraphdb.append.request.id.headers=true
        -Dreuse.vars.in.subselects=true
    networks:
      - graphdb
      - web
    profiles:
      - graphdb

  preload:
    container_name: graphdb-preload
    image: ontotext/graphdb:10.8.5
    entrypoint:
      [
        "/opt/graphdb/dist/bin/importrdf",
        "preload",
        "--force",
        "--restart",
        "--id",
        "addressing",
        "/opt/graphdb/home/graphdb-import",
      ]
    environment:
      GDB_JAVA_OPTS: >-
        -Xmx16g -Xms4g
        -Dgraphdb.home=/opt/graphdb/home
        -Dgraphdb.workbench.importDirectory=/opt/graphdb/home/graphdb-import
        -Dgraphdb.workbench.cors.enable=true
        -Denable-context-index=true
        -Dentity-pool-implementation=transactional
        -Dhealth.max.query.time.seconds=600
        -Dgraphdb.append.request.id.headers=true
        -Dreuse.vars.in.subselects=true
    volumes:
      - graphdb-data:/opt/graphdb/home
      - ./graphdb-import:/opt/graphdb/home/graphdb-import
    networks:
      - preload
    profiles:
      - graphdb:preload

  fuseki:
    build:
      context: ./fuseki
      dockerfile: Dockerfile.fuseki
    ports:
      - 3030:3030
    volumes:
      - ./fuseki-data:/fuseki
    environment:
      - JAVA_OPTIONS=-Xmx8192m -Xms8192m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    profiles:
      - fuseki

volumes:
  postgres-data:
  graphdb-data:

networks:
  postgres:
  graphdb:
  preload:
